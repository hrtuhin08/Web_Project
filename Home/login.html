<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Sign In | United International University Hostel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand">
        <div class="brand-icon">U</div>
        <div class="brand-text">UIU <span>HOSTEL</span></div>
      </a>
      <h2 style="font-size: 1.6rem; margin-top: 1rem;">Portal Sign In</h2>
      <p style="font-size: 0.88rem; margin-top: 0.25rem;">Select your user role or enter credentials to continue</p>
    </div>

    <!-- Quick Role Switcher for Demo -->
    <div class="role-switcher-tabs" id="roleTabs">
      <button type="button" class="role-tab-btn active" data-role="admin" data-email="admin@uiu.ac.bd">Admin</button>
      <button type="button" class="role-tab-btn" data-role="manager" data-email="manager@uiu.ac.bd">Manager</button>
      <button type="button" class="role-tab-btn" data-role="mess" data-email="mess@uiu.ac.bd">Mess Staff</button>
      <button type="button" class="role-tab-btn" data-role="boarder" data-email="boarder@uiu.ac.bd">Boarder</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="login_email">University Email or Student ID</label>
        <input type="text" id="login_email" class="form-control" required value="admin@uiu.ac.bd" placeholder="name@uiu.ac.bd or 011...">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="login_password" style="margin-bottom: 0;">Password</label>
          <a href="javascript:void(0)" onclick="HMS.openModal('forgotModal')" style="font-size: 0.8rem; font-weight: 600;">Forgot password?</a>
        </div>
        <input type="password" id="login_password" class="form-control" required value="password123" placeholder="••••••••">
      </div>

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label class="form-check">
          <input type="checkbox" id="remember_me" checked>
          <span>Remember my session</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">
        Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem;">
      New resident or applying for a seat? 
      <a href="register.html" style="font-weight: 700;">Apply for Seat</a>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Back to Public Homepage</a>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Password Recovery</h3>
        <button class="modal-close" onclick="HMS.closeModal('forgotModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 1rem; font-size: 0.92rem;">Enter your official university email to receive a password reset token.</p>
        <div class="form-group">
          <label class="form-label">University Email</label>
          <input type="email" id="reset_email" class="form-control" placeholder="student@uiu.ac.bd">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" onclick="HMS.closeModal('forgotModal')">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="handleResetPass()">Send Reset Link</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    let selectedRole = 'admin';

    // Role Tab Click
    document.querySelectorAll('.role-tab-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.role-tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        selectedRole = this.getAttribute('data-role');
        document.getElementById('login_email').value = this.getAttribute('data-email');
        document.getElementById('login_password').value = 'password123';
      });
    });

    // Handle Login
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('login_email').value.trim();
      const submitBtn = document.getElementById('loginSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      HMS.login(email, selectedRole);
    });

    function handleResetPass() {
      const email = document.getElementById('reset_email').value.trim();
      if (!email) {
        HMS.showToast('Please provide your university email.', 'warning');
        return;
      }
      HMS.closeModal('forgotModal');
      HMS.showToast('Password recovery instructions sent to ' + email, 'success');
    }
  </script>
</body>
</html>
